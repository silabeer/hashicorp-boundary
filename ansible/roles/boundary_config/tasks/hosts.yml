---
- name: Find static host catalogs (по env)
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} host-catalogs list -scope-id {{ _project_ids[item.key ~ '-servers'] }} -format json \
      | jq -r '.items[] | select(.type=="static") | .id'
  args:
    executable: /bin/bash
  loop: "{{ boundary_environments | dict2items }}"
  changed_when: false
  register: _cat_lookup

- name: Create static host catalogs
  when: (item.stdout | trim) == ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} host-catalogs create static \
      -scope-id {{ _project_ids[item.item.key ~ '-servers'] }} \
      -name servers -description "Managed by Ansible (GitOps)" \
      -format json | jq -r .item.id
  args:
    executable: /bin/bash
  loop: "{{ _cat_lookup.results }}"
  register: _cat_create

- name: Remember catalog ids (created)
  ansible.builtin.set_fact:
    _catalog_ids: "{{ _catalog_ids | default({}) | combine({item.item.item.key: (item.stdout | trim)}) }}"
  loop: "{{ _cat_create.results | default([]) }}"

- name: Remember catalog ids (existing)
  ansible.builtin.set_fact:
    _catalog_ids: "{{ _catalog_ids | default({}) | combine({item.item.key: (item.stdout | trim)}) }}"
  loop: "{{ _cat_lookup.results }}"
  when: (item.stdout | trim) != ""

- name: Find hosts
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} hosts list -host-catalog-id {{ _catalog_ids[item.env] }} -format json \
      | jq -r --arg n "{{ item.name }}" '.items[] | select(.name==$n) | .id'
  args:
    executable: /bin/bash
  loop: "{{ boundary_servers }}"
  changed_when: false
  register: _host_lookup

- name: Create hosts
  when: (item.stdout | trim) == ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} hosts create static \
      -host-catalog-id {{ _catalog_ids[item.item.env] }} \
      -name {{ item.item.name }} -address {{ item.item.address }} \
      -description "Managed by Ansible (GitOps)" -format json | jq -r .item.id
  args:
    executable: /bin/bash
  loop: "{{ _host_lookup.results }}"
  register: _host_create

- name: Update host addresses
  when: (item.stdout | trim) != ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} hosts update static -id {{ item.stdout | trim }} \
      -address {{ item.item.address }} >/dev/null
  args:
    executable: /bin/bash
  loop: "{{ _host_lookup.results }}"
  changed_when: false

- name: Remember host ids (created)
  ansible.builtin.set_fact:
    _host_ids: "{{ _host_ids | default({}) | combine({item.item.item.env ~ '/' ~ item.item.item.name: (item.stdout | trim)}) }}"
  loop: "{{ _host_create.results | default([]) }}"

- name: Remember host ids (existing)
  ansible.builtin.set_fact:
    _host_ids: "{{ _host_ids | default({}) | combine({item.item.env ~ '/' ~ item.item.name: (item.stdout | trim)}) }}"
  loop: "{{ _host_lookup.results }}"
  when: (item.stdout | trim) != ""

- name: Find host sets (по одному сету на хост)
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} host-sets list -host-catalog-id {{ _catalog_ids[item.env] }} -format json \
      | jq -r --arg n "{{ item.name }}" '.items[] | select(.name==$n) | .id'
  args:
    executable: /bin/bash
  loop: "{{ boundary_servers }}"
  changed_when: false
  register: _hset_lookup

- name: Create host sets
  when: (item.stdout | trim) == ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} host-sets create static \
      -host-catalog-id {{ _catalog_ids[item.item.env] }} \
      -name {{ item.item.name }} \
      -description "Managed by Ansible (GitOps)" -format json | jq -r .item.id
  args:
    executable: /bin/bash
  loop: "{{ _hset_lookup.results }}"
  register: _hset_create

- name: Converge host set membership
  when: (item.stdout | trim) != ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} host-sets set-hosts -id {{ item.stdout | trim }} \
      -host-id {{ _host_ids[item.item.env ~ '/' ~ item.item.name] }} >/dev/null
  args:
    executable: /bin/bash
  loop: "{{ _hset_lookup.results }}"
  changed_when: false

- name: Converge membership of created host sets
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} host-sets set-hosts -id {{ item.stdout | trim }} \
      -host-id {{ _host_ids[item.item.item.env ~ '/' ~ item.item.item.name] }} >/dev/null
  args:
    executable: /bin/bash
  loop: "{{ _hset_create.results | default([]) }}"
  changed_when: false

- name: Remember host set ids (created)
  ansible.builtin.set_fact:
    _host_set_ids: "{{ _host_set_ids | default({}) | combine({item.item.item.env ~ '/' ~ item.item.item.name: (item.stdout | trim)}) }}"
  loop: "{{ _hset_create.results | default([]) }}"

- name: Remember host set ids (existing)
  ansible.builtin.set_fact:
    _host_set_ids: "{{ _host_set_ids | default({}) | combine({item.item.env ~ '/' ~ item.item.name: (item.stdout | trim)}) }}"
  loop: "{{ _hset_lookup.results }}"
  when: (item.stdout | trim) != ""
