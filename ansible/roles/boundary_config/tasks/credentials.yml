---
- name: Find Vault credential stores
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-stores list -scope-id {{ _project_ids[item.name] }} -format json \
      | jq -r '.items[] | select(.type=="vault") | .id'
  args:
    executable: /bin/bash
  loop: "{{ _projects }}"
  changed_when: false
  register: _cs_lookup

- name: Create Vault credential stores
  when: (item.stdout | trim) == ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-stores create vault \
      -scope-id {{ _project_ids[item.item.name] }} \
      -name vault -address {{ vault_addr }} -token {{ boundary_vault_store_token }} \
      -description "Managed by Ansible (GitOps)" -format json | jq -r .item.id
  args:
    executable: /bin/bash
  loop: "{{ _cs_lookup.results }}"
  no_log: true
  register: _cs_create

- name: Update Vault credential stores (конвергенция адреса/токена)
  when: (item.stdout | trim) != ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-stores update vault -id {{ item.stdout | trim }} \
      -address {{ vault_addr }} -token {{ boundary_vault_store_token }} >/dev/null
  args:
    executable: /bin/bash
  loop: "{{ _cs_lookup.results }}"
  no_log: true
  changed_when: false

- name: Remember credential store ids (created)
  ansible.builtin.set_fact:
    _store_ids: "{{ _store_ids | default({}) | combine({item.item.item.name: (item.stdout | trim)}) }}"
  loop: "{{ _cs_create.results | default([]) }}"

- name: Remember credential store ids (existing)
  ansible.builtin.set_fact:
    _store_ids: "{{ _store_ids | default({}) | combine({item.item.name: (item.stdout | trim)}) }}"
  loop: "{{ _cs_lookup.results }}"
  when: (item.stdout | trim) != ""

- name: Find SSH certificate libraries (по env)
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-libraries list -credential-store-id {{ _store_ids[item.key ~ '-servers'] }} -format json \
      | jq -r --arg n "{{ boundary_vault.ssh_library_name }}" '.items[] | select(.name==$n) | .id'
  args:
    executable: /bin/bash
  loop: "{{ boundary_environments | dict2items }}"
  changed_when: false
  register: _lib_ssh_lookup

- name: Create SSH certificate libraries
  when: (item.stdout | trim) == ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-libraries create vault-ssh-certificate \
      -credential-store-id {{ _store_ids[item.item.key ~ '-servers'] }} \
      -name {{ boundary_vault.ssh_library_name }} \
      -vault-path {{ boundary_vault.ssh_path }} \
      -username {{ boundary_vault.ssh_user }} \
      -key-type {{ boundary_vault.ssh_key_type }} \
      -extension permit-pty= \
      -description "Managed by Ansible (GitOps)" -format json | jq -r .item.id
  args:
    executable: /bin/bash
  loop: "{{ _lib_ssh_lookup.results }}"
  register: _lib_ssh_create

- name: Update SSH certificate libraries
  when: (item.stdout | trim) != ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-libraries update vault-ssh-certificate \
      -id {{ item.stdout | trim }} \
      -vault-path {{ boundary_vault.ssh_path }} \
      -username {{ boundary_vault.ssh_user }} \
      -key-type {{ boundary_vault.ssh_key_type }} \
      -extension permit-pty= >/dev/null
  args:
    executable: /bin/bash
  loop: "{{ _lib_ssh_lookup.results }}"
  changed_when: false

- name: Remember SSH certificate library ids (created)
  ansible.builtin.set_fact:
    _ssh_lib_ids: "{{ _ssh_lib_ids | default({}) | combine({item.item.item.key: (item.stdout | trim)}) }}"
  loop: "{{ _lib_ssh_create.results | default([]) }}"

- name: Remember SSH certificate library ids (existing)
  ansible.builtin.set_fact:
    _ssh_lib_ids: "{{ _ssh_lib_ids | default({}) | combine({item.item.key: (item.stdout | trim)}) }}"
  loop: "{{ _lib_ssh_lookup.results }}"
  when: (item.stdout | trim) != ""

- name: Find k8s token libraries
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-libraries list -credential-store-id {{ _store_ids[item.env ~ '-kubernetes'] }} -format json \
      | jq -r --arg n "k8s-token-{{ item.name }}" '.items[] | select(.name==$n) | .id'
  args:
    executable: /bin/bash
  loop: "{{ boundary_k8s_clusters }}"
  changed_when: false
  register: _lib_k8s_lookup

- name: Create k8s token libraries
  when: (item.stdout | trim) == ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-libraries create vault-generic \
      -credential-store-id {{ _store_ids[item.item.env ~ '-kubernetes'] }} \
      -name k8s-token-{{ item.item.name }} \
      -vault-path {{ item.item.vault_mount }}/creds/{{ item.item.role }} \
      -vault-http-method POST \
      -vault-http-request-body '{{ {"kubernetes_namespace": item.item.namespace} | to_json }}' \
      -description "Managed by Ansible (GitOps)" -format json | jq -r .item.id
  args:
    executable: /bin/bash
  loop: "{{ _lib_k8s_lookup.results }}"
  register: _lib_k8s_create

- name: Update k8s token libraries
  when: (item.stdout | trim) != ""
  ansible.builtin.shell: |
    set -o pipefail
    {{ _boundary_conn_flags }} credential-libraries update vault-generic \
      -id {{ item.stdout | trim }} \
      -vault-path {{ item.item.vault_mount }}/creds/{{ item.item.role }} \
      -vault-http-method POST \
      -vault-http-request-body '{{ {"kubernetes_namespace": item.item.namespace} | to_json }}' >/dev/null
  args:
    executable: /bin/bash
  loop: "{{ _lib_k8s_lookup.results }}"
  changed_when: false

- name: Remember k8s library ids (created)
  ansible.builtin.set_fact:
    _lib_k8s_ids: "{{ _lib_k8s_ids | default({}) | combine({item.item.item.name: (item.stdout | trim)}) }}"
  loop: "{{ _lib_k8s_create.results | default([]) }}"

- name: Remember k8s library ids (existing)
  ansible.builtin.set_fact:
    _lib_k8s_ids: "{{ _lib_k8s_ids | default({}) | combine({item.item.name: (item.stdout | trim)}) }}"
  loop: "{{ _lib_k8s_lookup.results }}"
  when: (item.stdout | trim) != ""
